name: SIGO quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/sigo-supabase-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and verify lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json && npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
