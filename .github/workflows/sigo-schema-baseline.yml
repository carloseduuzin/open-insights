name: SIGO schema baseline + SLA hardening / PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/sigo-supabase-v1
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  schema-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_schema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigo_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_schema_ci
    steps:
      - uses: actions/checkout@v4
      - name: Stub minimal Supabase auth schema and roles (CI only)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT '11111111-1111-4111-8111-111111111111'::uuid $$;
          SQL
      - name: Apply public schema baseline from zero
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000200_sigo_schema_baseline.sql
      - name: Apply a second time (idempotency)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000200_sigo_schema_baseline.sql
      - name: Apply every following migration in filename order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            case "$migration" in
              supabase/migrations/20261116000200_sigo_schema_baseline.sql) continue ;;
            esac
            echo "Applying: $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert final schema object counts
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE v_tables integer; v_views integer; v_functions integer; v_policies integer; v_triggers integer;
          BEGIN
            SELECT count(*) INTO v_tables FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='r';
            SELECT count(*) INTO v_views FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='v';
            SELECT count(*) INTO v_functions FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname LIKE 'sigo_%';
            SELECT count(*) INTO v_policies FROM pg_policies WHERE schemaname='public';
            SELECT count(*) INTO v_triggers FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid WHERE c.relnamespace='public'::regnamespace AND NOT t.tgisinternal;
            IF v_tables <> 14 OR v_views <> 2 OR v_functions <> 15 OR v_policies <> 33 OR v_triggers <> 7 THEN
              RAISE EXCEPTION 'Unexpected schema inventory: tables %, views %, functions %, policies %, triggers %', v_tables,v_views,v_functions,v_policies,v_triggers;
            END IF;
          END;
          $test$;
          SQL
      - name: Assert RLS, SECURITY DEFINER and invoker views
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE v_tables_without_rls integer; v_definer_without_path integer; v_views_without_invoker integer;
          BEGIN
            SELECT count(*) INTO v_tables_without_rls
            FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='r' AND NOT relrowsecurity;
            SELECT count(*) INTO v_definer_without_path
            FROM pg_proc WHERE pronamespace='public'::regnamespace AND prosecdef
              AND NOT (COALESCE(proconfig, ARRAY[]::text[]) @> ARRAY['search_path=""']);
            SELECT count(*) INTO v_views_without_invoker
            FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='v'
              AND NOT (COALESCE(reloptions, ARRAY[]::text[]) @> ARRAY['security_invoker=true']);
            IF v_tables_without_rls <> 0 OR v_definer_without_path <> 0 OR v_views_without_invoker <> 0 THEN
              RAISE EXCEPTION 'Schema security regressions: no RLS %, unsafe definer %, no invoker %',
                v_tables_without_rls, v_definer_without_path, v_views_without_invoker;
            END IF;
          END;
          $test$;
          SQL
      - name: Assert SLA view, canhoto trigger, and duplicate protection
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_prestacao uuid;
            v_nf uuid;
            v_recebido timestamptz;
            v_bloqueou boolean := false;
          BEGIN
            -- The old baseline used CURRENT_DATE; the 0500 version must not.
            IF pg_get_viewdef('public.v_prestacoes_sla'::regclass, true) ~* '\mCURRENT_DATE\M' THEN
              RAISE EXCEPTION 'v_prestacoes_sla still contains CURRENT_DATE';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgrelid = 'public.prestacao_notas'::regclass
                AND tgname = 'prestacao_canhoto_auditoria'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'prestacao_canhoto_auditoria trigger is missing';
            END IF;

            -- Synthetic fixtures inside this isolated CI database only.
            INSERT INTO auth.users (id, raw_user_meta_data)
              VALUES ('11111111-1111-4111-8111-111111111111', '{}'::jsonb);
            INSERT INTO public.prestacoes (romaneio_oficial, d0)
              VALUES ('601615021154', CURRENT_DATE)
              RETURNING id INTO v_prestacao;
            INSERT INTO public.notas_fiscais (numero, serie, romaneio_origem)
              VALUES ('123456789', '1', '601615021154')
              RETURNING id INTO v_nf;
            INSERT INTO public.prestacao_notas (prestacao_id, nf_id)
              VALUES (v_prestacao, v_nf);

            UPDATE public.prestacao_notas SET canhoto_recebido_em = now()
              WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            SELECT canhoto_recebido_em INTO v_recebido
              FROM public.prestacao_notas
              WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            IF v_recebido IS NULL THEN
              RAISE EXCEPTION 'First canhoto receipt was not recorded';
            END IF;

            BEGIN
              UPDATE public.prestacao_notas SET canhoto_recebido_em = now() + interval '1 minute'
                WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            EXCEPTION WHEN OTHERS THEN
              IF SQLSTATE <> 'P0001' OR SQLERRM <> 'Canhoto já recebido' THEN
                RAISE;
              END IF;
              v_bloqueou := true;
            END;
            IF NOT v_bloqueou THEN
              RAISE EXCEPTION 'Duplicate canhoto receipt was accepted';
            END IF;
          END
          $test$;
          SQL
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
