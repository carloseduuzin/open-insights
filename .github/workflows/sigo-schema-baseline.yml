name: SIGO schema baseline + SLA hardening / PostgreSQL 17
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/sigo-supabase-v1
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  schema-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_schema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigo_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_schema_ci
    steps:
      - uses: actions/checkout@v4
      - name: Stub minimal Supabase auth schema and roles (CI only)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('sigo.uid', true), '')::uuid $$;
          SQL
      - name: Apply public schema baseline from zero
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000200_sigo_schema_baseline.sql
      - name: Apply a second time (idempotency)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000200_sigo_schema_baseline.sql
      - name: Apply every following migration in filename order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            case "$migration" in
              supabase/migrations/20261116000200_sigo_schema_baseline.sql) continue ;;
            esac
            echo "Applying: $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert final schema object counts
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE v_tables integer; v_views integer; v_functions integer; v_policies integer; v_triggers integer;
          BEGIN
            SELECT count(*) INTO v_tables FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='r';
            SELECT count(*) INTO v_views FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='v';
            SELECT count(*) INTO v_functions FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname LIKE 'sigo_%';
            SELECT count(*) INTO v_policies FROM pg_policies WHERE schemaname='public';
            SELECT count(*) INTO v_triggers FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid WHERE c.relnamespace='public'::regnamespace AND NOT t.tgisinternal;
            IF v_tables <> 15 OR v_views <> 3 OR v_functions <> 16 OR v_policies <> 34 OR v_triggers <> 7 THEN
              RAISE EXCEPTION 'Unexpected schema inventory: tables %, views %, functions %, policies %, triggers %', v_tables,v_views,v_functions,v_policies,v_triggers;
            END IF;
          END;
          $test$;
          SQL
      - name: Assert RLS, SECURITY DEFINER and invoker views
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE v_tables_without_rls integer; v_definer_without_path integer; v_views_without_invoker integer;
          BEGIN
            SELECT count(*) INTO v_tables_without_rls
            FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='r' AND NOT relrowsecurity;
            SELECT count(*) INTO v_definer_without_path
            FROM pg_proc WHERE pronamespace='public'::regnamespace AND prosecdef
              AND NOT (COALESCE(proconfig, ARRAY[]::text[]) @> ARRAY['search_path=""']);
            SELECT count(*) INTO v_views_without_invoker
            FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind='v'
              AND NOT (COALESCE(reloptions, ARRAY[]::text[]) @> ARRAY['security_invoker=true']);
            IF v_tables_without_rls <> 0 OR v_definer_without_path <> 0 OR v_views_without_invoker <> 0 THEN
              RAISE EXCEPTION 'Schema security regressions: no RLS %, unsafe definer %, no invoker %',
                v_tables_without_rls, v_definer_without_path, v_views_without_invoker;
            END IF;
          END;
          $test$;
          SQL
      - name: Assert SLA view, canhoto trigger, and duplicate protection
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_prestacao uuid;
            v_nf uuid;
            v_recebido timestamptz;
            v_bloqueou boolean := false;
          BEGIN
            -- The old baseline used CURRENT_DATE; the 0500 version must not.
            IF pg_get_viewdef('public.v_prestacoes_sla'::regclass, true) ~* '\mCURRENT_DATE\M' THEN
              RAISE EXCEPTION 'v_prestacoes_sla still contains CURRENT_DATE';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgrelid = 'public.prestacao_notas'::regclass
                AND tgname = 'prestacao_canhoto_auditoria'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'prestacao_canhoto_auditoria trigger is missing';
            END IF;

            -- Synthetic fixtures inside this isolated CI database only.
            PERFORM set_config('sigo.uid', '11111111-1111-4111-8111-111111111111', true);
            INSERT INTO auth.users (id, raw_user_meta_data)
              VALUES ('11111111-1111-4111-8111-111111111111', '{}'::jsonb);
            INSERT INTO public.prestacoes (romaneio_oficial, d0)
              VALUES ('601615021154', CURRENT_DATE)
              RETURNING id INTO v_prestacao;
            INSERT INTO public.notas_fiscais (numero, serie, romaneio_origem)
              VALUES ('123456789', '1', '601615021154')
              RETURNING id INTO v_nf;
            INSERT INTO public.prestacao_notas (prestacao_id, nf_id)
              VALUES (v_prestacao, v_nf);

            UPDATE public.prestacao_notas SET canhoto_recebido_em = now()
              WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            SELECT canhoto_recebido_em INTO v_recebido
              FROM public.prestacao_notas
              WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            IF v_recebido IS NULL THEN
              RAISE EXCEPTION 'First canhoto receipt was not recorded';
            END IF;

            BEGIN
              UPDATE public.prestacao_notas SET canhoto_recebido_em = now() + interval '1 minute'
                WHERE prestacao_id = v_prestacao AND nf_id = v_nf;
            EXCEPTION WHEN OTHERS THEN
              IF SQLSTATE <> 'P0001' OR SQLERRM <> 'Canhoto já recebido' THEN
                RAISE;
              END IF;
              v_bloqueou := true;
            END;
            IF NOT v_bloqueou THEN
              RAISE EXCEPTION 'Duplicate canhoto receipt was accepted';
            END IF;
          END
          $test$;
          SQL
      - name: Assert cross-operator lifecycle and reject user without role
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_a CONSTANT uuid := '22222222-2222-4222-8222-222222222222';
            v_b CONSTANT uuid := '33333333-3333-4333-8333-333333333333';
            v_sem_role CONSTANT uuid := '44444444-4444-4444-8444-444444444444';
            v_prestacao uuid;
            v_status text;
            v_responsavel uuid;
            v_conferida_por uuid;
            v_enviada_por uuid;
            v_retorno_em timestamptz;
            v_conferencia_em timestamptz;
            v_envio_em timestamptz;
            v_recusado boolean;
          BEGIN
            -- Three independent authenticated identities, only A and B operational.
            INSERT INTO auth.users (id, raw_user_meta_data)
              VALUES (v_a, '{}'::jsonb), (v_b, '{}'::jsonb), (v_sem_role, '{}'::jsonb);
            INSERT INTO public.profiles (id, nome, ativo)
              VALUES (v_a, 'Operador A', true), (v_b, 'Operador B', true),
                     (v_sem_role, 'Usuario sem role', true);
            INSERT INTO public.user_roles (user_id, role)
              VALUES (v_a, 'operacional'), (v_b, 'operacional');

            -- A creates and owns the prestação.
            PERFORM set_config('sigo.uid', v_a::text, true);
            SELECT id INTO STRICT v_prestacao
              FROM public.sigo_criar_prestacao('123456789012', (now() at time zone 'America/Sao_Paulo')::date);
            SELECT status, responsavel_id INTO STRICT v_status, v_responsavel
              FROM public.prestacoes WHERE id = v_prestacao;
            IF v_status <> 'ABERTA' OR v_responsavel IS DISTINCT FROM v_a THEN
              RAISE EXCEPTION 'A did not create ABERTA with immutable owner';
            END IF;

            -- B returns the same prestação without becoming its owner.
            PERFORM set_config('sigo.uid', v_b::text, true);
            PERFORM id FROM public.sigo_avancar_prestacao(v_prestacao, 'RETORNADA');
            SELECT status, responsavel_id, retornada_em
              INTO STRICT v_status, v_responsavel, v_retorno_em
              FROM public.prestacoes WHERE id = v_prestacao;
            IF v_status <> 'RETORNADA' OR v_responsavel IS DISTINCT FROM v_a OR v_retorno_em IS NULL THEN
              RAISE EXCEPTION 'B could not return prestação while preserving A as owner';
            END IF;

            -- A checks; B sends to JTI.
            PERFORM set_config('sigo.uid', v_a::text, true);
            PERFORM id FROM public.sigo_avancar_prestacao(v_prestacao, 'CONFERIDA');
            SELECT status, responsavel_id, conferida_em, conferida_por
              INTO STRICT v_status, v_responsavel, v_conferencia_em, v_conferida_por
              FROM public.prestacoes WHERE id = v_prestacao;
            IF v_status <> 'CONFERIDA' OR v_responsavel IS DISTINCT FROM v_a
               OR v_conferencia_em IS NULL OR v_conferida_por IS DISTINCT FROM v_a THEN
              RAISE EXCEPTION 'A could not confer prestação or conferência audit is incorrect';
            END IF;

            PERFORM set_config('sigo.uid', v_b::text, true);
            PERFORM id FROM public.sigo_enviar_prestacao_jti(v_prestacao);
            SELECT status, responsavel_id, enviada_em, enviada_por
              INTO STRICT v_status, v_responsavel, v_envio_em, v_enviada_por
              FROM public.prestacoes WHERE id = v_prestacao;
            IF v_status <> 'ENVIADA_JTI' OR v_responsavel IS DISTINCT FROM v_a
               OR v_envio_em IS NULL OR v_enviada_por IS DISTINCT FROM v_b THEN
              RAISE EXCEPTION 'B could not send prestação or envio audit/owner is incorrect';
            END IF;

            -- A profile without role must be denied by the RPC (not by a missing row).
            PERFORM set_config('sigo.uid', v_sem_role::text, true);
            v_recusado := false;
            BEGIN
              PERFORM id FROM public.sigo_criar_prestacao(
                '123456789013', (now() at time zone 'America/Sao_Paulo')::date
              );
            EXCEPTION WHEN OTHERS THEN
              IF SQLSTATE <> 'P0001' OR SQLERRM <> 'Usuário sem acesso ativo ao SIGO' THEN
                RAISE;
              END IF;
              v_recusado := true;
            END;
            IF NOT v_recusado THEN
              RAISE EXCEPTION 'User without role was allowed to create prestação';
            END IF;
            v_recusado := false;
            BEGIN
              PERFORM id FROM public.sigo_avancar_prestacao(v_prestacao, 'RETORNADA');
            EXCEPTION WHEN OTHERS THEN
              IF SQLSTATE <> 'P0001' OR SQLERRM <> 'Usuário sem acesso ativo ao SIGO' THEN
                RAISE;
              END IF;
              v_recusado := true;
            END;
            IF NOT v_recusado THEN
              RAISE EXCEPTION 'User without role was allowed to advance prestação';
            END IF;
            IF EXISTS (SELECT 1 FROM public.prestacoes WHERE romaneio_oficial = '123456789013') THEN
              RAISE EXCEPTION 'Unauthorized creation unexpectedly persisted';
            END IF;
          END
          $test$;
          SQL
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
