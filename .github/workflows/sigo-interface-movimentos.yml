name: SIGO interface movimentos - preparacao
on:
  push:
    branches: ['work/sigo-interface-movimentos']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Compilar interface
        run: npm run build
