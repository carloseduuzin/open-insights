name: SIGO efetividade de condutores
on:
  pull_request:
    branches: [feat/sigo-supabase-v1]
    paths: ['supabase/**', 'tests/efetividade-condutores.sql', '.github/workflows/sigo-efetividade-condutores.yml']
permissions:
  contents: read
jobs:
  exportacao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_exportacao
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_exportacao
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Gerar migration usando CLI sem acesso remoto
        run: |
          set -euo pipefail
          supabase --help
          supabase migration --help
          supabase migration new --help
          supabase migration new sigo_efetividade_condutores
          generated=$(find supabase/migrations -name '*_sigo_efetividade_condutores.sql')
          echo "::notice title=Migration gerada::$generated"
          cp supabase/changes/sigo_efetividade_condutores.sql "$generated"
      - name: Aplicar banco isolado
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY,raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('sigo.uid',true),'')::uuid $$;
          SQL
          for migration in supabase/migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Testar presenca, auditoria e resultados
        run: psql -X -v ON_ERROR_STOP=1 -f tests/efetividade-condutores.sql

