name: SIGO movimentos - homologacao isolada
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/sigo-supabase-v1]
    paths: ['supabase/**', 'tests/**', '.github/workflows/sigo-movimentos.yml']
permissions:
  contents: read
jobs:
  movimentos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_movimentos
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_movimentos
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Gerar nome da migration pela CLI sem acesso remoto
        run: |
          set -euo pipefail
          supabase --help
          supabase migration --help
          supabase migration new --help
          supabase migration new sigo_reentrega_transferencia
          generated=$(find supabase/migrations -name '*_sigo_reentrega_transferencia.sql')
          echo "::notice title=Migration gerada::$generated"
          cp supabase/changes/sigo_reentrega_transferencia.sql "$generated"
      - name: Preparar auth isolada e aplicar migrations
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY,raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('sigo.uid',true),'')::uuid $$;
          SQL
          for migration in supabase/migrations/*.sql; do
            echo "Aplicando $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Conferir regras e permissoes sem alterar producao
        run: psql -X -v ON_ERROR_STOP=1 -f tests/reentrega-transferencia-regras.sql
