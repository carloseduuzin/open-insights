name: SIGO StopView persistent import / PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/sigo-supabase-v1
    paths:
      - 'supabase/**'
      - 'src/lib/greenmile-import.ts'
      - 'src/routes/importacao.tsx'
      - 'tests/**'
      - '.github/workflows/sigo-stopview-import.yml'

permissions:
  contents: read

jobs:
  stopview-import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_stopview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigo_stopview_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_stopview_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated auth stubs (not the hosted Supabase)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('sigo.uid', true),'')::uuid $$;
          SQL
      - name: Apply baseline and all following migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run StopView persistence / negative / idempotency SQL tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/stopview-import.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
