name: SIGO StopView persistent import / PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/sigo-supabase-v1
    paths:
      - 'supabase/**'
      - 'src/lib/greenmile-import.ts'
      - 'src/routes/importacao.tsx'
      - 'tests/**'
      - '.github/workflows/sigo-stopview-import.yml'

permissions:
  contents: read

jobs:
  stopview-import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigo_stopview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigo_stopview_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sigo_stopview_ci
    steps:
      - uses: actions/checkout@v4
      - name: Checkout reviewed VT abastecimento PR #7 (CI only)
        uses: actions/checkout@v4
        with:
          ref: 69916f31feae7e80ab15b3b86f39ab129510345a
          path: sigo-vt-pr7
      - name: Prepare isolated auth stubs (not the hosted Supabase)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('sigo.uid', true),'')::uuid $$;
          SQL
      # PR #4 ainda não entrou na branch-base: valida exatamente seu commit revisado.
      - name: Checkout SLA hardening 0300 (PR #4, enquanto não mesclado)
        if: ${{ hashFiles('supabase/migrations/20261116000300_sigo_sla_hardening_v2.sql') == '' }}
        uses: actions/checkout@v4
        with:
          ref: a75c78884bfadab8479f4a6250a0d7fba879c23e
          path: sigo-sla-pr4
      - name: Apply baseline and all following migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            if [[ "$migration" == "supabase/migrations/20261116000400_sigo_importacao_nf.sql" && ! -f "supabase/migrations/20261116000300_sigo_sla_hardening_v2.sql" ]]; then
              echo "Applying reviewed 0300 from PR #4 before 0400"
              psql -X -v ON_ERROR_STOP=1 -f "sigo-sla-pr4/supabase/migrations/20261116000300_sigo_sla_hardening_v2.sql"
            fi
            if [[ "$migration" == "supabase/migrations/20261117000100_sigo_bipagem_canhotos.sql" && ! -f supabase/migrations/20261116000450_sigo_vt_abastecimento.sql ]]; then
              echo "Applying pending VT 0450 before bipagem"
              psql -X -v ON_ERROR_STOP=1 -f sigo-vt-pr7/supabase/migrations/20261116000450_sigo_vt_abastecimento.sql
            fi
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run StopView persistence / negative / idempotency SQL tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f supabase/migrations/20261116000450_sigo_vt_abastecimento.sql ]]; then
            psql -X -v ON_ERROR_STOP=1 -f tests/stopview-import.sql
          else
            psql -X -v ON_ERROR_STOP=1 -f sigo-vt-pr7/tests/stopview-import.sql
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
